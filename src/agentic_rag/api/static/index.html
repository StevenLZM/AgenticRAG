<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agentic RAG · 对话</title>
    <link rel="stylesheet" href="/static/app.css?v=20261002" />
  </head>
  <body>
    <button
      id="sidebar-backdrop"
      class="sidebar-backdrop"
      aria-label="关闭会话列表"
      hidden
    ></button>
    <aside id="session-sidebar" class="session-sidebar" aria-label="会话列表">
      <div class="brand">
        <span class="brand-mark">A</span>
        <div>Agentic RAG<small>与知识对话</small></div>
        <button
          id="close-sidebar"
          class="icon-button mobile-only"
          aria-label="关闭会话列表"
        >
          ×
        </button>
      </div>
      <button id="new-chat" class="new-chat">＋ 新建对话</button>
      <p class="section-label">最近对话</p>
      <nav id="session-list" aria-label="历史对话"></nav>
      <button id="more-sessions" class="text-button" hidden>
        加载更多对话
      </button>
      <div class="sidebar-tools">
        <button id="open-documents">文档知识库</button
        ><button id="open-memory">长期记忆</button
        ><button id="open-system">系统状态</button>
      </div>
      <p class="sidebar-footnote">对话分别保存 · 记忆按用户共享</p>
    </aside>
    <main class="chat-workspace">
      <header class="chat-header">
        <button
          id="open-sidebar"
          class="icon-button mobile-only"
          aria-label="打开会话列表"
        >
          ☰
        </button>
        <h1 id="session-title">新对话</h1>
        <div class="header-actions">
          <button id="rename-chat" class="text-button">重命名</button
          ><button id="delete-chat" class="text-button">删除</button>
        </div>
      </header>
      <div id="chat-notice" class="chat-notice" role="status" hidden></div>
      <div
        id="chat-scroll"
        class="chat-scroll"
        tabindex="0"
        aria-label="对话消息"
      >
        <div class="message-column">
          <button id="older-turns" class="text-button older-turns" hidden>
            加载更早消息
          </button>
          <section id="chat-empty" class="chat-empty">
            <span class="empty-mark">A</span>
            <h2>从一个问题开始</h2>
            <p>结合你的知识库与长期记忆，继续深入讨论。</p>
            <div class="empty-hints">
              <span>分析已上传的资料</span><span>追问与补充上下文</span
              ><span>按需查看引用来源</span>
            </div>
          </section>
          <div
            id="chat-messages"
            role="log"
            aria-label="用户问题和系统回答"
          ></div>
        </div>
      </div>
      <div class="composer-area">
        <button id="scroll-latest" class="latest-button" hidden>
          ↓ 回到最新
        </button>
        <div id="pending-actions" class="pending-actions" hidden>
          <span>提交结果尚未确认</span
          ><button id="check-submission" class="text-button">
            检查提交状态</button
          ><button id="retry-submission" class="text-button" hidden>
            重试原提交
          </button>
        </div>
        <form id="query-form" class="composer">
          <label class="sr-only" for="query-input">输入问题</label
          ><textarea
            id="query-input"
            rows="2"
            placeholder="发送消息，或继续追问…"
            required
          ></textarea>
          <div class="composer-toolbar">
            <span id="composer-status" role="status"
              >Enter 发送 · Shift + Enter 换行</span
            >
            <div>
              <button
                id="cancel-button"
                type="button"
                class="stop-button"
                hidden
              >
                停止</button
              ><button id="send-button" type="submit">发送 ↑</button>
            </div>
          </div>
        </form>
        <p class="composer-footnote">
          回答完成后整体展示，引用来源可按需展开。
        </p>
      </div>
    </main>
    <dialog
      id="tools-drawer"
      class="tools-drawer"
      aria-labelledby="tools-title"
    >
      <header>
        <h2 id="tools-title">工具</h2>
        <button id="close-tools" class="icon-button" aria-label="关闭工具">
          ×
        </button>
      </header>
      <section id="documents-tool" hidden>
        <p class="muted">知识库在你的所有会话中共享。</p>
        <form id="document-upload">
          <label for="document-file">上传 PDF、文本或 Excel</label
          ><input id="document-file" type="file" required /><button
            type="submit"
          >
            上传文档
          </button>
        </form>
        <p id="ingestion-status" role="status"></p>
        <h3>本页上传记录</h3>
        <ul id="upload-list" class="record-list"></ul>
      </section>
      <section id="memory-tool" hidden>
        <p class="muted">长期记忆按用户保存，切换会话后仍然可用。</p>
        <button id="reload-memories" class="secondary">刷新记忆</button>
        <ul id="memory-list" class="record-list"></ul>
      </section>
      <section id="system-tool" hidden>
        <p id="health-status" role="status"></p>
        <div id="health-grid"></div>
        <h3>运行快照</h3>
        <code id="snapshot-id"></code>
      </section>
    </dialog>
    <script src="/static/chat-state.js?v=20261001" defer></script>
    <script src="/static/chat-api.js?v=20261001" defer></script>
    <script src="/static/chat-view.js?v=20261002" defer></script>
    <script src="/static/console-tools.js?v=20261001" defer></script>
    <script src="/static/app.js?v=20261001" defer></script>
  </body>
</html>
